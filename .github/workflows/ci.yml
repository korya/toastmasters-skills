name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  avocetta:
    name: avocetta (spec + cross-runtime lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deterministic compliance against the agentskills.io / agent-plugins.org specs
      # plus Claude Code and Codex enforcement. Strict: silent degradation (e.g. a
      # SKILL.md over Codex's 8000-byte activation cap) fails the job. No config
      # file and no ignore list: every rule is enforced as written.
      - uses: korya/avocetta@v2
        with:
          dialect: spec,claude,codex
          strict: "true"
          pedantic: "true"
